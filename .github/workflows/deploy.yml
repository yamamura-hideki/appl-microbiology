name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.139.4
    steps:
      - uses: actions/checkout@v4

      # 初回のみ：旧Wixサイトから画像を取り込み、リポジトリに保存
      - name: Import images from Wix (first run only)
        run: |
          if [ ! -f static/images/.imported ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick) >/dev/null 2>&1 || echo "ImageMagick なし（縮小をスキップ）"
            bash scripts/import-wix.sh
            touch static/images/.imported
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static
            git commit -m "Import images from the old Wix site" && git push || true
          fi

      - name: Install Hugo
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Set repository for the admin page
        run: sed -i "s#__REPO__#${{ github.repository }}#; s#__SITE_URL__#${{ steps.pages.outputs.base_url }}/#" public/admin/config.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
