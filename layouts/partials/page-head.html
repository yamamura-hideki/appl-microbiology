<div class="page-head">
  <div class="wrap">
    {{ with .Parent }}{{ if and (not .IsHome) (ne .Section "pages") }}<p class="crumb"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>{{ end }}{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</div>
