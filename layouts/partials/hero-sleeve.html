{{/* レコードジャケット風ヒーロー：A面＝夕日のシャーレと富士山（放線菌）／B面＝真夜中のドライブ、発酵タンクの街と出芽酵母の月 */}}
<div class="sleeve-stage">
  <div class="disc" aria-hidden="true"><div class="disc-label"><img src="{{ "favicon.svg" | relURL }}" alt=""></div></div>
  <div class="sleeve" id="sleeve">
  <div class="sleeve-inner">
  <div class="face face-a" aria-hidden="true">
    <svg class="sleeve-art" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" role="img">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1F2152"/>
          <stop offset=".45" stop-color="#7A3F86"/>
          <stop offset=".72" stop-color="#FF5F8F"/>
          <stop offset=".8" stop-color="#FFB23F"/>
        </linearGradient>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE38A"/>
          <stop offset=".55" stop-color="#FFB23F"/>
          <stop offset="1" stop-color="#FF5F8F"/>
        </linearGradient>
        <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0F8FA8"/>
          <stop offset="1" stop-color="#1F2152"/>
        </linearGradient>
        <mask id="stripes">
          <rect width="600" height="600" fill="#fff"/>
          <rect y="372" width="600" height="5" fill="#000"/>
          <rect y="392" width="600" height="8" fill="#000"/>
          <rect y="413" width="600" height="11" fill="#000"/>
          <rect y="437" width="600" height="14" fill="#000"/>
          <rect y="462" width="600" height="18" fill="#000"/>
        </mask>
      </defs>
      <rect width="600" height="600" fill="url(#sky)"/>
      <!-- 星 -->
      <g fill="#fff" opacity=".7">
        <circle cx="70" cy="60" r="1.6"/><circle cx="150" cy="120" r="1.1"/><circle cx="520" cy="80" r="1.8"/>
        <circle cx="450" cy="150" r="1"/><circle cx="260" cy="40" r="1.2"/><circle cx="560" cy="200" r="1.1"/>
      </g>
      <!-- 太陽＝シャーレ -->
      <g mask="url(#stripes)" class="sun">
        <circle cx="300" cy="330" r="172" fill="url(#sun)"/>
        <circle cx="300" cy="330" r="164" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5"/>
        <circle cx="306" cy="324" r="172" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
        <!-- コロニー（放線菌の集落） -->
        <g class="colonies">
          <g><circle cx="230" cy="250" r="16" fill="#FFF6E0"/><circle cx="230" cy="250" r="22" fill="none" stroke="#FFF6E0" stroke-width="3" stroke-dasharray="1.5 3"/></g>
          <g><circle cx="330" cy="215" r="10" fill="#fff"/><circle cx="330" cy="215" r="15" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="1.5 3"/></g>
          <g><circle cx="385" cy="285" r="20" fill="#FFF0F5"/><circle cx="385" cy="285" r="27" fill="none" stroke="#FFF0F5" stroke-width="3" stroke-dasharray="1.5 3"/><circle cx="385" cy="285" r="7" fill="#FFB23F"/></g>
          <g><circle cx="270" cy="330" r="9" fill="#fff"/><circle cx="270" cy="330" r="13" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="1.5 3"/></g>
          <g><circle cx="190" cy="335" r="7" fill="#FFF6E0"/></g>
          <g><circle cx="420" cy="350" r="8" fill="#fff"/></g>
          <g><circle cx="300" cy="275" r="5" fill="#fff"/></g>
        </g>
      </g>
      <!-- 富士山 -->
      <path d="M-10 486 C110 450 200 380 268 318 L332 318 C400 380 490 450 610 486 Z" fill="#5B3E8E"/>
      <path d="M268 318 L332 318 L360 344 L346 338 L334 350 L320 340 L306 352 L292 340 L278 350 L266 338 L240 346 Z" fill="#fff"/>
      <path d="M-10 486 C80 468 150 452 210 440 C150 470 70 482 -10 492 Z" fill="#3F2A6E" opacity=".7"/>
      <!-- 湖面 -->
      <rect y="486" width="600" height="114" fill="url(#lake)"/>
      <g class="shimmer">
        <rect x="200" y="496" width="200" height="5" rx="2.5" fill="#FFB23F"/>
        <rect x="222" y="510" width="156" height="4" rx="2" fill="#FF8C6A"/>
        <rect x="246" y="523" width="108" height="4" rx="2" fill="#FF5F8F"/>
        <rect x="266" y="536" width="68" height="3" rx="1.5" fill="#FF5F8F"/>
        <rect x="282" y="548" width="36" height="3" rx="1.5" fill="#FF5F8F" opacity=".8"/>
      </g>
      <!-- ジャケットの文字 -->
      <text x="586" y="40" text-anchor="end" class="sleeve-side">SIDE A</text>
      <text x="586" y="584" text-anchor="end" class="sleeve-wordmark">Applied Microbiology</text>
    </svg>
    <div class="obi">
      <span class="obi-col"><span class="obi-small">山梨大学</span><span class="obi-title">応用微生物学研究室</span></span>
      <span class="obi-copy">{{ replace (.Params.catch | default "") "\n" "" }}</span>
      <span class="obi-mark">KOFU</span>
    </div>
  </div>
  <div class="face face-b" aria-hidden="true">
    <svg class="sleeve-art" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0D30"/><stop offset=".55" stop-color="#2C2370"/><stop offset=".72" stop-color="#9A3F86"/></linearGradient>
        <radialGradient id="cellB" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF7DC"/><stop offset=".6" stop-color="#FFE38A"/><stop offset="1" stop-color="#FFB23F"/></radialGradient>
        <linearGradient id="roadB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1F5C"/><stop offset="1" stop-color="#0B0D30"/></linearGradient>
        <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff"/><stop offset=".92" stop-color="#fff" stop-opacity=".15"/></linearGradient>
        <mask id="trailB"><rect y="380" width="600" height="220" fill="url(#fadeB)"/></mask>
      </defs>
      <rect width="600" height="600" fill="url(#skyB)"/>
      <!-- 星 -->
      <g fill="#fff" opacity=".7"><circle cx="60" cy="80" r="1.4"/><circle cx="160" cy="140" r="1"/><circle cx="520" cy="60" r="1.6"/><circle cx="560" cy="160" r="1.1"/><circle cx="420" cy="110" r="1"/></g>
      <!-- 月＝出芽酵母 -->
      <g class="yeast">
        <circle cx="300" cy="200" r="120" fill="#FFE38A" opacity=".07"/>
        <ellipse cx="292" cy="205" rx="82" ry="72" fill="url(#cellB)"/><circle cx="364" cy="140" r="30" fill="url(#cellB)"/>
        <ellipse cx="280" cy="214" rx="24" ry="20" fill="#FFF7DC" opacity=".9"/><circle cx="318" cy="186" r="5" fill="#FFB23F" opacity=".7"/>
      </g>
      <!-- 街並み（発酵タンク・フラスコ・ビル） -->
      <g fill="#1A1850">
        <rect x="0" y="300" width="58" height="80"/><path d="M66 380 L66 290 Q66 268 90 268 L110 268 Q134 268 134 290 L134 380 Z"/>
        <rect x="142" y="250" width="50" height="130"/><path d="M200 380 L200 330 L218 330 L218 290 L232 290 L232 330 L250 330 L250 380 Z"/>
        <rect x="350" y="262" width="54" height="118"/><path d="M410 380 L410 300 Q410 280 432 280 L452 280 Q474 280 474 300 L474 380 Z"/>
        <rect x="482" y="236" width="50" height="144"/><rect x="540" y="310" width="60" height="70"/>
      </g>
      <g fill="#FFB23F" opacity=".9"><rect x="150" y="266" width="7" height="7"/><rect x="170" y="290" width="7" height="7"/><rect x="360" y="280" width="7" height="7"/><rect x="380" y="310" width="7" height="7"/><rect x="492" y="252" width="7" height="7"/><rect x="512" y="282" width="7" height="7"/><rect x="10" y="318" width="7" height="7"/></g>
      <g stroke="#FF5F8F" stroke-width="3"><path d="M78 300 L122 300"/><path d="M78 322 L122 322"/><path d="M420 312 L464 312"/></g>
      <rect x="482" y="218" width="50" height="13" rx="3" fill="#38D0E8"/><text x="507" y="228" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#0B0D30" letter-spacing="1.5">GENE</text>
      <!-- 道路 -->
      <path d="M0 380 L600 380 L600 600 L0 600 Z" fill="url(#roadB)"/>
      <g mask="url(#trailB)">
        <path d="M300 380 L-40 600 M300 380 L640 600" stroke="#7F5BC4" stroke-width="2"/>
        <g stroke="#FFE38A" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M300 392 L300 404"/><path d="M300 420 L300 440"/><path d="M300 462 L300 500"/></g>
        <!-- テールランプ／ヘッドライトの光跡 -->
        <g fill="none" stroke-linecap="round">
          <path d="M296 384 C250 440 170 520 60 600" stroke="#FF5F8F" stroke-width="5" opacity=".9"/>
          <path d="M292 384 C230 450 140 530 20 600" stroke="#FF5F8F" stroke-width="3" opacity=".6"/>
          <path d="M304 384 C350 440 430 520 540 600" stroke="#FFF7DC" stroke-width="5" opacity=".85"/>
          <path d="M308 384 C370 450 460 530 580 600" stroke="#FFE38A" stroke-width="3" opacity=".6"/>
        </g>
      </g>
      <text x="586" y="40" text-anchor="end" class="sleeve-side">SIDE B</text>
      <text x="22" y="40" class="sleeve-side">MIDNIGHT FERMENT</text>
      <text x="586" y="584" text-anchor="end" class="sleeve-wordmark">Applied Microbiology</text>
    </svg>
  </div>
  </div>
  </div>
  <button type="button" class="flip-hint" id="flipBtn" aria-controls="sleeve" aria-pressed="false"><span class="fh-a">SIDE A</span><span class="fh-sep" aria-hidden="true">⇄</span><span class="fh-b">SIDE B</span><span class="fh-txt">裏返す</span></button>
</div>
<script>
(function(){var s=document.getElementById('sleeve'),b=document.getElementById('flipBtn');if(!s||!b)return;
function set(on){s.classList.toggle('is-flipped',on);b.setAttribute('aria-pressed',on)}
b.addEventListener('click',function(){set(!s.classList.contains('is-flipped'))});
s.addEventListener('click',function(){if(!matchMedia('(hover:hover)').matches)set(!s.classList.contains('is-flipped'))});})();
</script>
