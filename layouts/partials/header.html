<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "" | relURL }}">
      <span><strong>{{ site.Title }}</strong><small>{{ site.Params.subtitle }}</small></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="メニュー"><span></span><span></span><span></span></button>
    <nav class="site-nav" id="site-nav">
      <ul>
      {{- $cur := . }}
      {{- range site.Menus.main }}
        <li class="{{ if .HasChildren }}has-sub{{ end }}{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} active{{ end }}">
          <a href="{{ .URL }}">{{ .Name }}</a>
          {{- if .HasChildren }}
          <ul class="sub">
            {{- range .Children }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}
          </ul>
          {{- end }}
        </li>
      {{- end }}
      </ul>
    </nav>
  </div>
</header>
