# GitHub Pages の URL に合わせて変更してください（例: https://<ユーザー名>.github.io/<リポジトリ名>/）
# GitHub Actions でビルドする場合は自動で上書きされます。
baseURL = "https://example.github.io/appl-microbiology/"
languageCode = "ja"
defaultContentLanguage = "ja"
title = "応用微生物学研究室"
hasCJKLanguage = true
enableRobotsTXT = true

[params]
  subtitle = "山梨大学 生命環境学部 生命工学科"
  description = "山梨大学応用微生物学研究室は酵母や放線菌を用いた医薬品探索などを行う研究室です。"
  address = "〒400-8510 山梨県甲府市武田4-4-37 山梨大学 生命環境学部 生命工学科"
  # 問い合わせ用メールアドレス（公開してよいものを設定。空欄なら非表示）
  email = ""

[markup.goldmark.renderer]
  unsafe = true

