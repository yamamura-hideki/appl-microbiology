<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2152">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お知らせ投稿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>お知らせ投稿 | 応用微生物学研究室</title>
<style>
:root{--navy:#1F2152;--lagoon:#0F8FA8;--pink:#FF5F8F;--mango:#FFB23F;--sky:#CDEFF7;--line:#DCE3EE;--muted:#5A5F80;--err:#C62D4F}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--navy);background:linear-gradient(180deg,var(--sky),#fff 320px);min-height:100vh;line-height:1.7}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:1.05rem;margin:0;line-height:1.3}
header small{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
header button{margin-left:auto}
main{max-width:640px;margin:0 auto;padding:6px 18px calc(110px + env(safe-area-inset-bottom))}
.card{background:#fff;border:2px solid var(--navy);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:5px 5px 0 var(--sky)}
label.f{display:block;font-weight:700;font-size:.9rem;margin:0 0 6px}
label.f span{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
input[type=text],input[type=date],input[type=password],textarea{width:100%;font:inherit;font-size:16px;color:inherit;border:1.5px solid var(--line);border-radius:12px;padding:.7em .9em;background:#fff}
input:focus,textarea:focus{outline:3px solid rgba(255,95,143,.35);border-color:var(--pink)}
textarea{min-height:180px;resize:vertical;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:.4em .95em;border-radius:999px;border:1.5px solid var(--line);font-size:.86rem;background:#fff}
.chips input:checked+span{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--navy)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sky)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .badge{position:absolute;left:6px;top:6px;background:var(--pink);color:#fff;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px}
.photos button{position:absolute;right:5px;top:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(31,33,82,.75);color:#fff;font-size:1rem;line-height:1;cursor:pointer}
.add-photo{display:flex;align-items:center;justify-content:center;gap:8px;padding:.85em;border:2px dashed var(--lagoon);border-radius:12px;color:var(--lagoon);font-weight:700;cursor:pointer;background:#f6fcfe}
.add-photo input{display:none}
.hint{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.8em 1.4em;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff;box-shadow:4px 4px 0 var(--pink)}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);padding:.45em 1em;font-size:.82rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.bar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .btn-primary{flex:1;font-size:1.05rem;padding:.9em}
.status{font-size:.85rem}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
.msg.ok{background:#e8f8ef;border:1.5px solid #3aa76d}
.msg.err{background:#fdecef;border:1.5px solid var(--err);color:var(--err)}
.msg a{color:inherit;font-weight:700}
.recent{list-style:none;margin:0;padding:0;font-size:.88rem}
.recent li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.recent li:last-child{border-bottom:0}
.recent time{color:var(--lagoon);font-family:ui-monospace,monospace;font-size:.8rem;flex:none;padding-top:.15em}
dialog{border:2px solid var(--navy);border-radius:16px;padding:20px;max-width:min(520px,92vw);color:var(--navy)}
dialog::backdrop{background:rgba(31,33,82,.45)}
dialog h2{margin:0 0 8px;font-size:1.1rem}
dialog p{font-size:.86rem;margin:.4em 0 1em}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.spinner{display:inline-block;width:1em;height:1em;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<header>
  <img src="../favicon.svg" alt="">
  <h1>お知らせ投稿<small>応用微生物学研究室</small></h1>
  <button class="btn btn-ghost" id="openSettings" type="button">設定</button>
</header>

<main>
  <div id="msg" role="status" aria-live="polite"></div>

  <form id="form" novalidate>
    <div class="card">
      <div class="field">
        <label class="f" for="title">タイトル</label>
        <input type="text" id="title" required placeholder="例：日本放線菌学会大会で発表しました" autocomplete="off">
      </div>
      <div class="field">
        <label class="f" for="date">日付</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <span class="f" style="display:block;font-weight:700;font-size:.9rem;margin-bottom:6px">カテゴリー<span style="font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px">複数選択できます</span></span>
        <div class="chips" id="cats"></div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label class="f" for="body">本文<span>空行で段落が分かれます</span></label>
        <textarea id="body" placeholder="内容を書いてください"></textarea>
      </div>
      <div class="field">
        <span style="display:block;font-weight:700;font-size:.9rem;margin-bottom:6px">写真<span style="font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px">1枚目が記事の先頭に大きく出ます</span></span>
        <label class="add-photo"><input type="file" id="files" accept="image/*" multiple>＋ 写真を選ぶ・撮る</label>
        <div class="photos" id="photos"></div>
        <p class="hint">写真は自動で縮小（長辺1600px）してからアップロードします。</p>
      </div>
    </div>
  </form>

  <div class="card">
    <h2 style="font-size:1rem;margin:0 0 8px">最近の投稿</h2>
    <ul class="recent" id="recent"><li>設定のあとに表示されます</li></ul>
    <p class="hint">投稿の修正・削除は、ホームページの管理画面（/admin/）から行えます。</p>
  </div>
</main>

<div class="bar"><div class="bar-inner">
  <button class="btn btn-primary" id="submit" type="button">投稿する</button>
</div></div>

<dialog id="settings">
  <h2>設定</h2>
  <p>GitHubのトークン（管理画面のサインインに使っているもの）を入力してください。トークンはこの端末のブラウザの中にだけ保存されます。</p>
  <label class="f" for="token">トークン</label>
  <input type="password" id="token" autocomplete="off" placeholder="github_pat_… または ghp_…">
  <label class="f" for="repo" style="margin-top:12px">リポジトリ</label>
  <input type="text" id="repo" autocomplete="off" placeholder="ユーザー名/リポジトリ名">
  <div class="row">
    <button class="btn btn-ghost" type="button" id="clearToken">トークンを消去</button>
    <button class="btn btn-primary" type="button" id="saveSettings">保存</button>
  </div>
</dialog>

<script>
(function(){
  'use strict';
  var CATS=['論文・研究成果','学会発表','受賞','共同研究','研究活動','研究室行事','メディア掲載','お知らせ'];
  var BRANCH='main';
  var $=function(id){return document.getElementById(id)};
  var store={get:function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set:function(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
  var photos=[]; // {blob, url}

  // 既定のリポジトリ（URLから推定）
  function guessRepo(){
    var h=location.hostname.match(/^([^.]+)\.github\.io$/);
    var seg=location.pathname.split('/').filter(Boolean)[0];
    if(h&&seg&&seg!=='post') return h[1]+'/'+seg;
    if(h) return h[1]+'/'+h[1]+'.github.io';
    return '';
  }
  function cfg(){return {token:store.get('post.token'),repo:store.get('post.repo')||guessRepo()}}
  function siteBase(){var p=location.pathname.replace(/post\/?(index\.html)?$/,'');return location.origin+p}

  // カテゴリー
  CATS.forEach(function(c,i){
    var l=document.createElement('label');
    l.innerHTML='<input type="checkbox" value="'+c+'" id="c'+i+'"><span>'+c+'</span>';
    $('cats').appendChild(l);
  });
  // 日付
  function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
  $('date').value=today();

  // 下書きの自動保存
  function saveDraft(){store.set('post.draft',JSON.stringify({t:$('title').value,b:$('body').value,c:checked()}))}
  function checked(){return [].slice.call(document.querySelectorAll('#cats input:checked')).map(function(x){return x.value})}
  try{var d=JSON.parse(store.get('post.draft')||'null');if(d){$('title').value=d.t||'';$('body').value=d.b||'';(d.c||[]).forEach(function(v){var el=document.querySelector('#cats input[value="'+v+'"]');if(el)el.checked=true})}}catch(e){}
  ['title','body'].forEach(function(id){$(id).addEventListener('input',saveDraft)});
  $('cats').addEventListener('change',saveDraft);

  // 写真
  function resize(file){
    return new Promise(function(res,rej){
      var img=new Image(),u=URL.createObjectURL(file);
      img.onload=function(){
        var max=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function(b){b?res(b):rej(new Error('画像の変換に失敗しました'))},'image/jpeg',0.85);
      };
      img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('この画像は読み込めませんでした：'+file.name))};
      img.src=u;
    });
  }
  function renderPhotos(){
    var box=$('photos');box.innerHTML='';
    photos.forEach(function(p,i){
      var f=document.createElement('figure');
      f.innerHTML=(i===0?'<span class="badge">先頭</span>':'')+'<img alt="写真'+(i+1)+'"><button type="button" aria-label="写真'+(i+1)+'を外す">×</button>';
      f.querySelector('img').src=p.url;
      f.querySelector('button').onclick=function(){URL.revokeObjectURL(p.url);photos.splice(i,1);renderPhotos()};
      box.appendChild(f);
    });
  }
  $('files').addEventListener('change',function(e){
    var fs=[].slice.call(e.target.files||[]);e.target.value='';
    Promise.all(fs.map(function(f){return resize(f).then(function(b){photos.push({blob:b,url:URL.createObjectURL(b)})})}))
      .then(renderPhotos).catch(function(err){show('err',err.message);renderPhotos()});
  });

  // メッセージ
  function show(type,html){$('msg').innerHTML=html?'<div class="msg '+type+'">'+html+'</div>':'';if(html)window.scrollTo({top:0,behavior:'smooth'})}

  // GitHub API
  function api(path,opt){
    var c=cfg();opt=opt||{};
    return fetch('https://api.github.com/repos/'+c.repo+path,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'},body:opt.body?JSON.stringify(opt.body):undefined})
      .then(function(r){
        if(r.ok) return r.status===204?null:r.json();
        return r.json().catch(function(){return{}}).then(function(j){
          var m=r.status===401?'トークンが正しくないか、期限が切れています。「設定」から入れ直してください。':
                r.status===403?'このトークンには書き込みの権限がありません（Contents の Read and write が必要です）。':
                r.status===404?'リポジトリが見つかりません。「設定」のリポジトリ名を確認してください。':
                'GitHubとの通信でエラーが起きました（'+r.status+'）。'+(j.message?'：'+j.message:'');
          throw new Error(m);
        });
      });
  }
  function b64(blob){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.readAsDataURL(blob)})}
  function utf8b64(s){return btoa(unescape(encodeURIComponent(s)))}
  function q(s){return JSON.stringify(s)}

  function buildMarkdown(o){
    var fm=['---','title: '+q(o.title),'date: '+o.date,'show_day: true'];
    if(o.cats.length) fm.push('categories: ['+o.cats.map(q).join(', ')+']');
    if(o.images.length){fm.push('images:');o.images.forEach(function(p){fm.push('  - src: '+q(p))})}
    fm.push('---','');
    return fm.join('\n')+o.body.replace(/\r\n/g,'\n').trim()+'\n';
  }

  function stamp(){var d=new Date();function z(n){return String(n).padStart(2,'0')}return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())}

  function submit(){
    show('', '');
    var c=cfg();
    if(!c.token||!c.repo){openSettings();return}
    var title=$('title').value.trim(),date=$('date').value,body=$('body').value;
    if(!title){show('err','タイトルを入力してください。');$('title').focus();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){show('err','日付を入力してください。');$('date').focus();return}
    var btn=$('submit');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>投稿しています…';
    var id=stamp(),cats=checked(),files=[],imgPaths=[];
    Promise.all(photos.map(function(p,i){return b64(p.blob).then(function(d){
      var name=id+'-'+(i+1)+'.jpg';imgPaths[i]='/images/uploads/'+name;
      files[i]={path:'static/images/uploads/'+name,content:d,encoding:'base64'};
    })})).then(function(){
      var md=buildMarkdown({title:title,date:date,cats:cats,body:body,images:imgPaths});
      files.push({path:'content/news/'+id+'.md',content:utf8b64(md),encoding:'base64'});
      var ref,baseTree;
      return api('/git/ref/heads/'+BRANCH)
        .then(function(r){ref=r.object.sha;return api('/git/commits/'+ref)})
        .then(function(cm){baseTree=cm.tree.sha;
          return Promise.all(files.map(function(f){return api('/git/blobs',{method:'POST',body:{content:f.content,encoding:f.encoding}}).then(function(b){return{path:f.path,mode:'100644',type:'blob',sha:b.sha}})}))})
        .then(function(tree){return api('/git/trees',{method:'POST',body:{base_tree:baseTree,tree:tree}})})
        .then(function(t){return api('/git/commits',{method:'POST',body:{message:'追加: お知らせ 「'+title+'」（投稿アプリ）',tree:t.sha,parents:[ref]}})})
        .then(function(nc){return api('/git/refs/heads/'+BRANCH,{method:'PATCH',body:{sha:nc.sha}})})
        .then(function(){
          var url=siteBase()+'news/'+id.toLowerCase()+'/';
          show('ok','投稿しました。1〜2分ほどでホームページに反映されます。<br><a href="'+url+'" target="_blank" rel="noopener">記事を見る →</a>');
          $('title').value='';$('body').value='';$('date').value=today();
          [].forEach.call(document.querySelectorAll('#cats input'),function(x){x.checked=false});
          photos.forEach(function(p){URL.revokeObjectURL(p.url)});photos=[];renderPhotos();store.set('post.draft','');
          setTimeout(loadRecent,1500);
        });
    }).catch(function(err){show('err',(err&&err.message)||'投稿できませんでした。通信状態を確認して、もう一度お試しください。')})
    .then(function(){btn.disabled=false;btn.textContent='投稿する'});
  }
  $('submit').addEventListener('click',submit);

  // 最近の投稿
  function loadRecent(){
    var c=cfg();if(!c.token||!c.repo)return;
    api('/contents/content/news?ref='+BRANCH).then(function(list){
      var mds=list.filter(function(f){return /\.md$/.test(f.name)&&f.name!=='_index.md'}).sort(function(a,b){return a.name<b.name?1:-1}).slice(0,5);
      return Promise.all(mds.map(function(f){return fetch(f.download_url).then(function(r){return r.text()}).then(function(t){
        var ti=(t.match(/^title:\s*"?(.*?)"?\s*$/m)||[])[1]||f.name,da=(t.match(/^date:\s*(\S+)/m)||[])[1]||'';return{t:ti,d:da}})}));
    }).then(function(items){
      items.sort(function(a,b){return a.d<b.d?1:-1});
      $('recent').innerHTML=items.map(function(x){var li=document.createElement('li');li.innerHTML='<time></time><span></span>';li.querySelector('time').textContent=x.d.slice(0,10);li.querySelector('span').textContent=x.t;return li.outerHTML}).join('')||'<li>まだ投稿がありません</li>';
    }).catch(function(err){$('recent').innerHTML='<li>'+err.message+'</li>'});
  }

  // 設定
  function openSettings(){var c=cfg();$('token').value=c.token;$('repo').value=c.repo;$('settings').showModal()}
  $('openSettings').addEventListener('click',openSettings);
  $('saveSettings').addEventListener('click',function(){store.set('post.token',$('token').value.trim());store.set('post.repo',$('repo').value.trim());$('settings').close();show('ok','設定を保存しました。');loadRecent()});
  $('clearToken').addEventListener('click',function(){store.set('post.token','');$('token').value='';show('ok','この端末からトークンを消去しました。')});

  if(!cfg().token) openSettings(); else loadRecent();
})();
</script>
</body>
</html>
